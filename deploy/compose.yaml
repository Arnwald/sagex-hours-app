# sagex-hours on a Linux server with Docker, from the published image.
#
#   mkdir -p /srv/sagex-hours && cd /srv/sagex-hours
#   (copy this file here as compose.yaml, adapt the three values marked ADAPT)
#   docker compose up -d
#   docker compose pull && docker compose up -d     # later, to update
#
# The image is private while the repository is: on the server, run once
#   docker login ghcr.io -u <account> -p <token with read:packages>
# (or make the package public in GitHub › Packages › Package settings).

services:
  sagex-hours:
    image: ghcr.io/arnwald/sagex-hours-app:latest
    container_name: sagex-hours
    restart: unless-stopped

    ports:
      # ADAPT if 8080 is taken. Colleagues open http://<server>:8080 over the VPN.
      - "8080:8080"

    environment:
      TZ: Europe/Zurich
      # ADAPT — required: without it, whoever reaches this port reads and
      # changes the hours. It is the first administrator's key once several
      # users are enabled; every colleague then gets a key of their own.
      # Generate it with: openssl rand -hex 24
      SAGEX_TOKEN: "REPLACE-ME"

    volumes:
      # ADAPT — where the plain base lives on the server: users.json and one
      # folder per user (users/<id>/). Back this folder up.
      - /srv/sagex-hours/data:/data

    # The base's files belong to this user on the server (default: root).
    # user: "1000:1000"
