services:
  sagex-hours:
    build: .
    image: sagex-hours:latest
    container_name: sagex-hours
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/Zurich
      # Jeton d'accès : sans lui, l'instance est ouverte à qui peut l'atteindre.
      # Indispensable dès que l'app sort du réseau local.
      # SAGEX_TOKEN: "un-jeton-long-et-aleatoire"
      # Permet l'import Toggl sans écrire le jeton dans settings.json.
      # TOGGL_API_TOKEN: "..."
    volumes:
      # La base en clair : catalog.json, settings.json, entries/, backups/
      - ./data:/data
    # Sur TrueNAS, aligner sur le propriétaire du dataset monté :
    # user: "1000:1000"
