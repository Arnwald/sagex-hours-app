# Builds the image from this checkout (heavier: Rust compiles on the server at
# every update). deploy/compose.yaml uses the published image instead.
services:
  sagex-hours:
    build: .
    image: sagex-hours:latest
    container_name: sagex-hours
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/Zurich
      # Single user: the access token. Several users: the first administrator's
      # key when they are enabled (each user then has their own key).
      # Generate it with: openssl rand -hex 24
      # SAGEX_TOKEN: "a-long-random-token"
      # Lets the Toggl import run without writing the token into settings.json.
      # TOGGL_API_TOKEN: "..."
    volumes:
      # The plain base: users.json and users/<id>/ (or, single-user,
      # catalog.json, settings.json, entries/, backups/).
      - ./data:/data
    # To match the owner of the mounted folder:
    # user: "1000:1000"
