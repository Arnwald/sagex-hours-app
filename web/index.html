<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="app.title">Heures SageX</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>⏱</text></svg>">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand" data-i18n-html="app.brand">Heures <small>SageX</small></div>

    <div class="segmented" role="group" aria-label="Vue" data-i18n-aria-label="nav.view">
      <button id="tab-week" aria-pressed="true" data-i18n="nav.week">Semaine</button>
      <button id="tab-month" aria-pressed="false" data-i18n="nav.month">Mois</button>
    </div>

    <div class="period">
      <button id="prev" class="ghost" title="Période précédente" data-i18n-title="nav.prev">‹</button>
      <button id="today" class="ghost" data-i18n="nav.today">Aujourd'hui</button>
      <button id="next" class="ghost" title="Période suivante" data-i18n-title="nav.next">›</button>
      <h1 id="period-label">—</h1>
    </div>

    <div class="spacer"></div>

    <div class="totals" id="totals"></div>
    <div class="timer-box" id="timer">
      <span class="elapsed">—</span>
      <button id="timer-toggle" class="ghost" title="Démarrer un chronomètre">▶</button>
    </div>

    <div class="segmented lang-switch" id="lang-switch" role="group" aria-label="Langue" data-i18n-aria-label="lang.switch">
      <button data-lang="fr" lang="fr" title="Français" aria-pressed="true">FR</button>
      <button data-lang="en" lang="en" title="English" aria-pressed="false">EN</button>
    </div>

    <span class="who" id="who" hidden></span>
    <button id="open-manage" title="Projets, activités et tâches" data-i18n="nav.manage" data-i18n-title="nav.manageTitle">Gérer</button>
  </header>

  <div class="banner" id="backup-banner" hidden>
    <span id="backup-text"></span>
    <div class="spacer"></div>
    <button id="backup-now" class="primary" data-i18n="backup.download">Télécharger la sauvegarde</button>
    <button id="backup-later" class="ghost" data-i18n="backup.later">Plus tard</button>
  </div>

  <main>
    <aside class="sidebar">
      <h2 data-i18n="presets.heading" data-i18n-title="presets.hint">Tâches</h2>
      <div class="search"><input id="preset-search" type="search" placeholder="Filtrer…" data-i18n-placeholder="presets.filter" autocomplete="off"></div>
      <div class="preset-list" id="preset-list" data-i18n-title="presets.hint"></div>
    </aside>

    <section class="view" id="view-week"></section>
    <section class="view" id="view-month" hidden></section>

    <aside class="editor" id="editor" hidden>
      <header>
        <h2 id="editor-title">Saisie</h2>
        <button id="editor-close" class="ghost" title="Fermer" data-i18n-title="editor.close">✕</button>
      </header>
      <div class="body">
        <div class="field">
          <label for="f-preset" data-i18n="editor.preset">Tâche</label>
          <select id="f-preset"><option value="">—</option></select>
        </div>
        <div class="field">
          <label for="f-project" data-i18n="editor.project">Projet SageX</label>
          <select id="f-project"></select>
        </div>
        <div class="field">
          <label for="f-activity" data-i18n="editor.activity">Activité SageX</label>
          <select id="f-activity"></select>
        </div>
        <div class="field" data-i18n-title="editor.commentHint">
          <label for="f-comment" data-i18n="editor.comment">Commentaire</label>
          <textarea id="f-comment" rows="3"></textarea>
        </div>
        <div class="field">
          <label for="f-date" data-i18n="editor.date">Date</label>
          <input id="f-date" type="date">
        </div>
        <div class="row" id="f-times">
          <div class="field">
            <label for="f-start" data-i18n="editor.start">Début</label>
            <input id="f-start" type="time" step="300">
          </div>
          <div class="field">
            <label for="f-end" data-i18n="editor.end">Fin</label>
            <input id="f-end" type="time" step="300">
          </div>
          <div class="field">
            <label for="f-duration" data-i18n="editor.duration">Durée</label>
            <input id="f-duration" type="text" placeholder="1h30">
          </div>
        </div>
        <div class="hint" id="editor-hint"></div>
      </div>
      <footer>
        <button id="editor-save" class="primary">Enregistrer</button>
        <button id="editor-duplicate" data-i18n="editor.duplicate">Dupliquer</button>
        <div class="spacer" style="flex:1"></div>
        <button id="editor-delete" class="danger" data-i18n="editor.delete">Supprimer</button>
      </footer>
    </aside>
  </main>
</div>


<script type="module" src="/js/app.js"></script>
</body>
</html>
